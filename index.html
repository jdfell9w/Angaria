<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Angaria delphinus — Babylon WebXR Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #07111c 0%, #02050b 70%, #000000 100%);
    font-family: Arial, sans-serif;
}

#renderCanvas {
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
}

#hud {
    position: absolute;
    top: 14px;
    left: 14px;
    color: #d8f7ff;
    background: rgba(0,0,0,0.45);
    padding: 12px 14px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    z-index: 10;
    max-width: 420px;
    border: 1px solid rgba(120,220,255,0.25);
}

#hud h2 {
    margin: 0 0 8px 0;
    color: #8de7ff;
    font-weight: 600;
}

#hud p {
    margin: 4px 0;
    line-height: 1.35;
}

.small {
    opacity: 0.8;
    font-size: 13px;
}
</style>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>

<body>

<div id="hud">
<h2>Angaria delphinus</h2>
<p>Illert / Cortie / Santilli inspired shell geometry</p>
<p class="small">
Quest 3 compatible • WebXR enabled • Pearlescent museum lighting
</p>
<p class="small">
Place <b>angaria_delphinus_illert_cortie.glb</b>
in the same folder as this index.html.
</p>
</div>

<canvas id="renderCanvas"></canvas>

<script>

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, {
    preserveDrawingBuffer: true,
    stencil: true
});

const createScene = async function() {

    const scene = new BABYLON.Scene(engine);

    scene.clearColor = new BABYLON.Color4(0.005, 0.01, 0.02, 1.0);

    // Camera
    const camera = new BABYLON.ArcRotateCamera(
        "camera",
        Math.PI / 2,
        Math.PI / 2.5,
        18,
        new BABYLON.Vector3(0, 0, 0),
        scene
    );

    camera.attachControl(canvas, true);

    camera.lowerRadiusLimit = 5;
    camera.upperRadiusLimit = 50;
    camera.wheelDeltaPercentage = 0.01;

    // Lighting
    const hemi = new BABYLON.HemisphericLight(
        "hemi",
        new BABYLON.Vector3(0, 1, 0),
        scene
    );

    hemi.intensity = 0.75;

    const rimBlue = new BABYLON.PointLight(
        "rimBlue",
        new BABYLON.Vector3(-8, 5, -6),
        scene
    );

    rimBlue.diffuse = new BABYLON.Color3(0.2, 0.9, 1.0);
    rimBlue.intensity = 120;

    const warm = new BABYLON.PointLight(
        "warm",
        new BABYLON.Vector3(8, 3, 6),
        scene
    );

    warm.diffuse = new BABYLON.Color3(1.0, 0.55, 0.18);
    warm.intensity = 100;

    // Glow layer
    const glow = new BABYLON.GlowLayer("glow", scene);
    glow.intensity = 0.55;

    // Floating particles
    const particleSystem = new BABYLON.ParticleSystem("particles", 3000, scene);

    particleSystem.particleTexture = new BABYLON.Texture(
        "https://playground.babylonjs.com/textures/flare.png",
        scene
    );

    particleSystem.emitter = new BABYLON.Vector3(0,0,0);

    particleSystem.minEmitBox = new BABYLON.Vector3(-20,-20,-20);
    particleSystem.maxEmitBox = new BABYLON.Vector3(20,20,20);

    particleSystem.color1 = new BABYLON.Color4(0.2,0.9,1.0,0.8);
    particleSystem.color2 = new BABYLON.Color4(0.9,0.4,1.0,0.7);

    particleSystem.minSize = 0.03;
    particleSystem.maxSize = 0.15;

    particleSystem.minLifeTime = 4;
    particleSystem.maxLifeTime = 12;

    particleSystem.emitRate = 250;

    particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;

    particleSystem.gravity = new BABYLON.Vector3(0,0,0);

    particleSystem.direction1 = new BABYLON.Vector3(-0.02,0.01,-0.02);
    particleSystem.direction2 = new BABYLON.Vector3(0.02,0.03,0.02);

    particleSystem.minAngularSpeed = 0;
    particleSystem.maxAngularSpeed = Math.PI;

    particleSystem.minEmitPower = 0.02;
    particleSystem.maxEmitPower = 0.08;

    particleSystem.updateSpeed = 0.015;

    particleSystem.start();

    // Load GLB
    BABYLON.SceneLoader.Append(
        "./",
        "angaria_delphinus_illert_cortie.glb",
        scene,
        function(scene) {

            const meshes = scene.meshes;

            for (let i = 0; i < meshes.length; i++) {

                const m = meshes[i];

                if (m.material) {

                    // Push toward vibrant nacre
                    if (m.material.metallic !== undefined) {
                        m.material.metallic = 0.35;
                    }

                    if (m.material.roughness !== undefined) {
                        m.material.roughness = 0.12;
                    }

                    if (m.material.clearCoat !== undefined) {
                        m.material.clearCoat.isEnabled = true;
                        m.material.clearCoat.intensity = 1.0;
                    }

                    if (m.material.subSurface) {
                        m.material.subSurface.isRefractionEnabled = true;
                    }
                }
            }

            // Auto-center
            const root = scene.meshes[0];

            // Slow museum rotation
            scene.registerBeforeRender(function() {
                root.rotation.y += 0.0018;
            });
        }
    );

    // WebXR
    const xr = await scene.createDefaultXRExperienceAsync({
        floorMeshes: []
    });

    return scene;
};

createScene().then(scene => {

    engine.runRenderLoop(function() {
        scene.render();
    });

});

window.addEventListener("resize", function() {
    engine.resize();
});

</script>

</body>
</html>
