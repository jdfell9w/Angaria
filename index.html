<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Angaria v19.1 Lip Beads Square Base</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
#renderCanvas { width:100%; height:100%; display:block; touch-action:none; }
#overlay {
  position:absolute; top:18px; left:18px; width:440px; padding:18px;
  color:#d8f7ff; background:rgba(0,0,0,.56);
  border:1px solid rgba(120,220,255,.25); border-radius:18px;
  backdrop-filter:blur(6px); z-index:10;
}
#overlay h1 { margin:0 0 10px 0; color:#8feaff; }
.info { margin-top:12px; color:#ffc27d; line-height:1.45; }
</style>
</head>
<body>
<div id="overlay">
  <h2>Angaria v20</h2>
<ul>
  <li>No-seam base shell</li>
  <li>1024 amethyst clusters</li>
  <li>Restored beads</li>
  <li>Babylon-compatible materials</li>
  <li>Draco-compressed GLB</li>
</ul>

</div>
  
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, antialias:true });

const createScene = async () => {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.002,0.002,0.008,1);

  scene.imageProcessingConfiguration.toneMappingEnabled = true;
  scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_KHR_PBR_NEUTRAL;
  scene.imageProcessingConfiguration.exposure = 1.18;
  scene.imageProcessingConfiguration.contrast = 1.07;

  const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.35, 8.8, new BABYLON.Vector3(0,0.6,0.25), scene);
  camera.attachControl(canvas, true);
  camera.wheelDeltaPercentage = 0.01;
  camera.lowerRadiusLimit = 2.0;
  camera.upperRadiusLimit = 30;

  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.90;

  const cyan = new BABYLON.PointLight("cyan", new BABYLON.Vector3(5,7,5), scene);
  cyan.diffuse = new BABYLON.Color3(0.35,0.80,1.0);
  cyan.intensity = 36;

  const warm = new BABYLON.PointLight("warm", new BABYLON.Vector3(-5,4,4), scene);
  warm.diffuse = new BABYLON.Color3(0.90,0.45,0.20);
  warm.intensity = 24;

  const purple = new BABYLON.PointLight("purple", new BABYLON.Vector3(0,2,3), scene);
  purple.diffuse = new BABYLON.Color3(0.52,0.10,0.95);
  purple.intensity = 22;

  try {
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./", "angaria_v19_1_640_lip_beads_square_base.glb?v=191beadsbase1", scene);
    const root = new BABYLON.TransformNode("angariaRoot", scene);
    result.meshes.forEach(m => { if (m.name !== "__root__") m.parent = root; });
    root.position.y = 0.65;
    root.scaling = new BABYLON.Vector3(1.40,1.40,1.40);
    scene.registerBeforeRender(() => { root.rotation.y += 0.0008; });
  } catch(e) {
    console.error(e);
    alert("Failed to load GLB. Check exact filename and GitHub path.");
  }

  try { await scene.createDefaultXRExperienceAsync({}); } catch(e) { console.log("XR unavailable:", e); }
  return scene;
};

createScene().then(scene => engine.runRenderLoop(() => scene.render()));
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
